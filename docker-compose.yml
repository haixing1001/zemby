services:
  zemby:
    image: ghcr.io/haixing1001/zemby:latest
    container_name: zemby
    restart: unless-stopped
    ports:
      - "8097:8097"        # Web / API 端口
    environment:
      - GEMBY_SERVER_NAME=Go Emby Server
      - GEMBY_ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your shell or .env file}   # 首次启动密码，至少 12 个字符
      - MEDIA_ROOTS=/media                                 # 容器内允许访问的媒体根目录
      - TZ=Asia/Shanghai
    volumes:
      - ./config:/config      # 数据库、刮削元数据
      - ${MEDIA_PATH:-./media}:/media   # 媒体文件目录（按需修改左侧宿主机路径）
